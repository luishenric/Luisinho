<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1600px;height:1000px;background:linear-gradient(#f3f4f6,#dfe3e8);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#t{position:absolute;top:22px;width:100%;text-align:center;font-size:34px;font-weight:bold;color:#1f2933}
#s{position:absolute;top:70px;width:100%;text-align:center;font-size:20px;color:#52606d}
.c{position:absolute;top:110px;width:800px;height:780px}
.l{position:absolute;top:860px;width:800px;text-align:center;font-size:22px;font-weight:bold;color:#1f2933}
#f{position:absolute;bottom:22px;width:100%;text-align:center;font-size:18px;color:#52606d}
</style></head><body>
<div id="t">Caixa dutada vertical – Bomber Bicho Papão 8"</div>
<div id="s">250 × 350 × 260 mm (L × A × P) · 12 L líquidos · sintonia ≈ 40 Hz · duto PVC 75 mm ≈ 56 cm</div>
<div class="c" id="a" style="left:0"></div><div class="c" id="b" style="left:800px"></div>
<div class="l" style="left:0">Frente</div><div class="l" style="left:800px">Traseira aberta – caminho do duto</div>
<div id="f">MDF 15 mm · saída do duto na traseira · grave ≈ 38 Hz ao ar livre / ≈ 35 Hz no carro</div>
<script src="node_modules/three/build/three.min.js"></script>
<script>
const W=25,H=35,D=26,T=1.5;const DY=4.5;
function mdfTex(){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');
 g.fillStyle='#c79b5e';g.fillRect(0,0,512,512);
 for(let i=0;i<4000;i++){g.fillStyle=`rgba(${120+Math.random()*60|0},${85+Math.random()*40|0},${40+Math.random()*30|0},${Math.random()*0.18})`;g.fillRect(Math.random()*512,Math.random()*512,2,2);}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
const X0=xr=>11-xr, Y0=yr=>-16+yr;
function scene(open){
 const s=new THREE.Scene();
 const mdf=new THREE.MeshStandardMaterial({map:mdfTex(),roughness:0.85});
 const inner=new THREE.MeshStandardMaterial({color:0xe9dcc3,roughness:0.95,side:THREE.DoubleSide});
 const g=new THREE.Group();s.add(g);
 const panel=(w,h,d,x,y,z,m=mdf)=>{const p=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);p.position.set(x,y,z);p.castShadow=p.receiveShadow=true;g.add(p);return p;};
 // painéis: frente (+z) com furo
 const sh=new THREE.Shape();sh.moveTo(-W/2,-H/2);sh.lineTo(W/2,-H/2);sh.lineTo(W/2,H/2);sh.lineTo(-W/2,H/2);sh.lineTo(-W/2,-H/2);
 const hole=new THREE.Path();hole.absarc(0,DY,9.25,0,Math.PI*2,true);sh.holes.push(hole);
 const fr=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:T,bevelEnabled:false}),mdf);fr.position.z=D/2-T;fr.castShadow=true;g.add(fr);
 panel(W,T,D-T,0,-H/2+T/2,-T/2);panel(W,T,D-T,0,H/2-T/2,-T/2);
 panel(T,H-2*T,D-T,-W/2+T/2,0,-T/2);panel(T,H-2*T,D-T,W/2-T/2,0,-T/2);
 // interior claro
 // (sem painel interno)
 if(!open){const bk=new THREE.Shape();bk.moveTo(-W/2,-H/2);bk.lineTo(W/2,-H/2);bk.lineTo(W/2,H/2);bk.lineTo(-W/2,H/2);bk.lineTo(-W/2,-H/2);
  const p=new THREE.Path();p.absarc(X0(17.5),Y0(4.5),3.75,0,Math.PI*2,true);bk.holes.push(p);
  const b=new THREE.Mesh(new THREE.ExtrudeGeometry(bk,{depth:T,bevelEnabled:false}),mdf);b.position.z=-D/2;g.add(b);}
 else{ // traseira removida: mostrar borda dos painéis; não desenha tampa
 }
 // alto-falante
 const black=new THREE.MeshStandardMaterial({color:0x1c1c1c,roughness:0.6,metalness:0.2});
 const cone=new THREE.MeshStandardMaterial({color:0x2a2a2a,roughness:0.9,side:THREE.DoubleSide});
 const rub=new THREE.MeshStandardMaterial({color:0x111111,roughness:0.5});
 const metal=new THREE.MeshStandardMaterial({color:0xb8bcc2,metalness:0.9,roughness:0.3});
 const zf=D/2; const spk=new THREE.Group(); spk.position.y=DY; g.add(spk); const gg=g;
 const fs=new THREE.Shape();const r=1.6,a=10.35;fs.moveTo(-a+r,-a);fs.lineTo(a-r,-a);fs.quadraticCurveTo(a,-a,a,-a+r);fs.lineTo(a,a-r);fs.quadraticCurveTo(a,a,a-r,a);fs.lineTo(-a+r,a);fs.quadraticCurveTo(-a,a,-a,a-r);fs.lineTo(-a,-a+r);fs.quadraticCurveTo(-a,-a,-a+r,-a);
 const fh=new THREE.Path();fh.absarc(0,0,9.3,0,Math.PI*2,true);fs.holes.push(fh);
 const frame=new THREE.Mesh(new THREE.ExtrudeGeometry(fs,{depth:0.5,bevelEnabled:true,bevelSize:0.15,bevelThickness:0.15}),black);frame.position.z=zf;frame.castShadow=true;spk.add(frame);
 const sur=new THREE.Mesh(new THREE.TorusGeometry(8.4,0.85,24,96),rub);sur.position.z=zf+0.25;spk.add(sur);
 const pts=[];for(let i=0;i<=20;i++){const t=i/20;pts.push(new THREE.Vector2(2.6+t*(7.6-2.6),-3.2+Math.pow(t,0.8)*3.4));}
 const cn=new THREE.Mesh(new THREE.LatheGeometry(pts,96),cone);cn.rotation.x=Math.PI/2;cn.position.z=zf+0.2;spk.add(cn);
 const cap=new THREE.Mesh(new THREE.SphereGeometry(3.4,48,24,0,Math.PI*2,0,Math.PI/3.2),rub);cap.rotation.x=Math.PI/2;cap.position.z=zf-3.6;spk.add(cap);
 for(const[x,y]of[[-8.7,-8.7],[8.7,-8.7],[-8.7,8.7],[8.7,8.7]]){const sc=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.3,16),metal);sc.rotation.x=Math.PI/2;sc.position.set(x,y,zf+0.8);spk.add(sc);}
 // cesta + ímã (dentro)
 const bask=new THREE.Mesh(new THREE.CylinderGeometry(9,6.7,9.5,48,1,true),black);bask.rotation.x=Math.PI/2;bask.position.z=zf-T-4.75;spk.add(bask);
 const mag=new THREE.Mesh(new THREE.CylinderGeometry(6.7,6.7,3.6,48),new THREE.MeshStandardMaterial({color:0x2d2f33,metalness:0.6,roughness:0.4}));mag.rotation.x=Math.PI/2;mag.position.z=zf-11.3;spk.add(mag);
 const pl=new THREE.Mesh(new THREE.CylinderGeometry(6.9,6.9,0.5,48),metal);pl.rotation.x=Math.PI/2;pl.position.z=zf-13.3;spk.add(pl);
 // duto
 const pvc=new THREE.MeshStandardMaterial({color:0x3d8bd4,roughness:0.45,metalness:0.05,side:THREE.DoubleSide});
 const zp=-D/2+T+4.5; const X=X0, Y=Y0;
 const P=(x,y,z)=>new THREE.Vector3(x,y,z);
 const path=new THREE.CurvePath();const R=4.2;
 const seg=(a,b)=>path.add(new THREE.LineCurve3(a,b));const bend=(a,c,b)=>path.add(new THREE.QuadraticBezierCurve3(a,c,b));
 const ex=X(17.5),ey=Y(4.5),ty=Y(27.5),lx=X(4.5),endy=Y(13.5);
 seg(P(ex,ey,-D/2),P(ex,ey,zp-R));bend(P(ex,ey,zp-R),P(ex,ey,zp),P(ex,ey+R,zp));
 seg(P(ex,ey+R,zp),P(ex,ty-R,zp));bend(P(ex,ty-R,zp),P(ex,ty,zp),P(ex+(lx>ex?R:-R),ty,zp));
 seg(P(ex+(lx>ex?R:-R),ty,zp),P(lx-(lx>ex?R:-R),ty,zp));bend(P(lx-(lx>ex?R:-R),ty,zp),P(lx,ty,zp),P(lx,ty-R,zp));
 seg(P(lx,ty-R,zp),P(lx,endy,zp));
 const endx=lx;
 const tube=new THREE.Mesh(new THREE.TubeGeometry(path,300,3.75,48,false),pvc);tube.castShadow=true;g.add(tube);
 const ringM=new THREE.MeshStandardMaterial({color:0x2a6fb0,roughness:0.4});
 const fl=new THREE.Mesh(new THREE.TorusGeometry(3.95,0.5,16,64),ringM);fl.position.set(ex,ey,-D/2-0.1);g.add(fl);
 const fl2=new THREE.Mesh(new THREE.TorusGeometry(3.95,0.35,16,64),ringM);fl2.rotation.x=Math.PI/2;fl2.position.set(endx,endy,zp);g.add(fl2);
 const hole2=new THREE.Mesh(new THREE.CircleGeometry(3.6,48),new THREE.MeshBasicMaterial({color:0x0b1a2a}));hole2.position.set(ex,ey,-D/2-0.12);hole2.rotation.y=Math.PI;g.add(hole2);
 // chão + luz
 const fl0=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.ShadowMaterial({opacity:0.22}));fl0.rotation.x=-Math.PI/2;fl0.position.y=-H/2-0.01;fl0.receiveShadow=true;s.add(fl0);
 s.add(new THREE.HemisphereLight(0xffffff,0x8a8f99,1.1));
 const dl=new THREE.DirectionalLight(0xffffff,2.2);dl.position.set(open?-30:30,60,open?-25:45);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);
 Object.assign(dl.shadow.camera,{left:-50,right:50,top:50,bottom:-50});s.add(dl);
 const d2=new THREE.DirectionalLight(0xffffff,0.8);d2.position.set(open?40:-40,20,open?-60:30);s.add(d2);
 return s;}
function render(id,open,cam){
 const el=document.getElementById(id);const rd=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
 rd.setSize(800,780);rd.shadowMap.enabled=true;rd.shadowMap.type=THREE.PCFSoftShadowMap;rd.outputColorSpace=THREE.SRGBColorSpace;rd.toneMapping=THREE.ACESFilmicToneMapping;
 el.appendChild(rd.domElement);
 const c=new THREE.PerspectiveCamera(30,800/780,1,500);c.position.set(...cam);c.lookAt(0,0.5,0);
 rd.render(scene(open),c);}
render('a',false,[50,34,88]);
render('b',true,[-48,32,-88]);
window.done=true;
</script></body></html>
